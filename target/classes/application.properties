## Spring DATASOURCE (Using H2 In-Memory Database)

# H2 Settings
spring.datasource.url=jdbc:h2:mem:bbdb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console settings
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
# Set web-allow-others to true to allow remote access (use with caution)
spring.h2.console.settings.web-allow-others=false


## Hibernate Properties
# The SQL dialect makes Hibernate generate better SQL for the chosen database
# Comment out MySQL dialect
# spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.MySQL5InnoDBDialect
# H2 Dialect
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.H2Dialect

# Hibernate ddl auto (create, create-drop, validate, update)
# Using update for dev convenience with H2, consider create-drop or validate later
spring.jpa.hibernate.ddl-auto = update

server.port=8069