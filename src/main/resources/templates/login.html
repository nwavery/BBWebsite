<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity5">
<head>
<meta charset="utf-8" />
<meta http-equiv="X-UA-Compatible" content="IE=edge" />
<meta name="viewport" content="width=device-width, initial-scale=1" />

<!-- Updated BS5 CSS -->
<link rel="stylesheet" type="text/css"
	th:href="@{/webjars/bootstrap/5.3.2/css/bootstrap.min.css}" />
<link rel="stylesheet" type="text/css" th:href="@{/css/main.css}" />

<title>Login</title>
</head>
<body>
	<!-- Updated BS5 Navbar -->
	<nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
		<div class="container">
			<a class="navbar-brand" th:href="@{/}">Blood Bowl Stats</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarColor02" aria-controls="navbarColor02" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarColor02">
                <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link" th:href="@{/registration}">Register</a></li>
                </ul>
            </div>
		</div>
	</nav>

	<div class="container" style="padding-top: 70px;">
		<div class="row">
			<div class="col-md-6 offset-md-3">
				<h1>Login</h1>
				<form th:action="@{/login}" method="post">

					<!-- error message -->
					<div th:if="${param.error}" class="alert alert-danger alert-dismissible fade show" role="alert">
						Invalid username or password.
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
					</div>

					<!-- logout message -->
					<div th:if="${param.logout}" class="alert alert-success alert-dismissible fade show" role="alert">
						You have been logged out.
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
					</div>

					<!-- Updated BS5 Form -->
					<div class="mb-3">
						<label for="username" class="form-label"> Email </label> : <input type="text"
							id="username" name="username" class="form-control"
							autofocus="autofocus" placeholder="Email" required />
					</div>
					<div class="mb-3">
						<label for="password" class="form-label">Password</label>: <input
							type="password" id="password" name="password"
							class="form-control" placeholder="Password" required />
					</div>
					<div class="d-grid gap-2">
						<button type="submit" name="login-submit" id="login-submit"
							class="btn btn-primary">Log In</button>
					</div>
				</form>
				<div class="mt-3">
					New user? <a href="/" th:href="@{/registration}">Register here</a>
				</div>
			</div>
		</div>
	</div>

	<!-- Updated Bootstrap 5 JS Bundle -->
	<script type="text/javascript"
		th:src="@{/webjars/bootstrap/5.3.2/js/bootstrap.bundle.min.js}"></script>
	<script type="text/javascript"
		th:src="@{/webjars/jquery/3.6.4/jquery.min.js}"></script>

</body>
</html>
