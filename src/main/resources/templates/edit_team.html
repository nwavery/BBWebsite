<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity5">
<head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Edit Team</title>

    <!-- Updated BS5 CSS -->
    <link rel="stylesheet" type="text/css" th:href="@{/webjars/bootstrap/5.3.2/css/bootstrap.min.css}" />
    <link rel="stylesheet" type="text/css" th:href="@{/css/main.css}" />
</head>
<body>
    <!-- Updated BS5 Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
        <div class="container">
             <a class="navbar-brand" th:href="@{/}">Blood Bowl Stats</a>
             <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarColor02" aria-controls="navbarColor02" aria-expanded="false" aria-label="Toggle navigation">
                 <span class="navbar-toggler-icon"></span>
             </button>
             <div class="collapse navbar-collapse" id="navbarColor02">
                 <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                     <li class="nav-item"><a class="nav-link" th:href="@{/}">Home</a></li>
                     <li class="nav-item"><a class="nav-link" th:href="@{/teams}">Your Teams</a></li>
                     <li class="nav-item"><a class="nav-link" th:href="@{/matches/new}">Record Match</a></li>
                     <li class="nav-item"><a class="nav-link" th:href="@{/matches/history}">Match History</a></li>
                     <li class="nav-item"><a class="nav-link" th:href="@{/matches/standings}">Standings</a></li>
                     <li class="nav-item" sec:authorize="isAuthenticated()"><a class="nav-link" th:href="@{/logout}">Logout</a></li>
                 </ul>
             </div>
         </div>
    </nav>

    <div class="container" style="padding-top: 70px;">
        <div class="row">
            <div class="col-md-6 offset-md-3">

                <h1>Edit Team</h1>

                <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
                    <span th:text="${errorMessage}">Error placeholder</span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
                <div th:if="${param.error}" class="alert alert-warning alert-dismissible fade show" role="alert">
                    There were errors with your submission. Please check the fields below.
                     <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>

                <form th:action="@{/teams/{id}(id=${teamId})}" th:object="${teamDto}" method="post">
                    <div th:if="${#fields.hasErrors('*')}" class="alert alert-danger">
                        Please correct the errors below.
                    </div>

                    <div class="mb-3">
                        <label class="form-label" for="name"> Team Name </label>
                        <input id="name" class="form-control" th:field="*{name}" required autofocus="autofocus" />
                        <p class="text-danger" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></p>
                    </div>

                    <div class="mb-3">
                        <label class="form-label" for="race"> Race </label>
                        <select id="race" class="form-select" th:field="*{race}" required>
                            <option value="">-- Select Race --</option>
                            <option th:each="raceOpt : ${T(net.bst.springboot.springsecurity.model.Race).values()}"
                                    th:value="${raceOpt}" th:text="${raceOpt.displayName}">Race Name</option>
                        </select>
                        <p class="text-danger" th:if="${#fields.hasErrors('race')}" th:errors="*{race}"></p>
                    </div>

                    <div class="mb-3">
                        <button type="submit" class="btn btn-primary">Update Team</button>
                        <a th:href="@{/teams}" class="btn btn-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Updated Bootstrap 5 JS Bundle -->
    <script type="text/javascript" th:src="@{/webjars/bootstrap/5.3.2/js/bootstrap.bundle.min.js}"></script>
    <script type="text/javascript" th:src="@{/webjars/jquery/3.6.4/jquery.min.js}"></script>
</body>
</html>
