<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity3">
<head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Create New Team</title>

    <link rel="stylesheet" type="text/css" th:href="@{/webjars/bootstrap/3.3.7/css/bootstrap.min.css}" />

    <link rel="stylesheet" type="text/css" th:href="@{/css/main.css}" />

</head>
<body>
    <nav class="navbar navbar-inverse navbar-fixed-top">
        <div class="container">
            <div class="navbar-header">
                <button type="button" class="navbar-toggle collapsed"
                        data-toggle="collapse" data-target="#navbar" aria-expanded="false"
                        aria-controls="navbar">
                    <span class="sr-only">Toggle navigation</span> <span
                        class="icon-bar"></span> <span class="icon-bar"></span> <span
                        class="icon-bar"></span>
                </button>
                <a class="navbar-brand" href="#" th:href="@{\/">Blood Bowl Stats</a>
            </div>
            <div id="navbar" class="collapse navbar-collapse">
                <ul class="nav navbar-nav">
                    <li><a th:href="@{/}">Home</a></li>
                    <li><a th:href="@{/teams}">Your Teams</a></li>
                    <li><a th:href="@{/matches/new}">Record Match</a></li>
                    <li><a th:href="@{/matches/history}">Match History</a></li>
                    <li><a th:href="@{/matches/standings}">Standings</a></li>
                    <li sec:authorize="isAuthenticated()"><a th:href="@{/logout}">Logout</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <br>
    <br>

    <div class="container">
        <div class="row">
            <div class="col-md-6 col-md-offset-3">

                <!-- success message -->
                <div th:if="${param.success}">
                    <div class="alert alert-info">Team created successfully!</div>
                </div>

                <h1>Create New Team</h1>

                <form th:action="@{/teams}" th:object="${team}" method="post">

                    <div class="form-group">
                        <label class="control-label" for="name"> Team Name </label>
                        <input id="name" class="form-control" th:field="*{name}" required autofocus="autofocus" />
                    </div>

                    <div class="form-group" th:classappend="${#fields.hasErrors('race')}? 'has-error' : ''">
                        <label class="control-label" for="race"> Race </label>
                        <select id="race" class="form-control" th:field="*{race}" required>
                            <option value="">-- Select Race --</option>
                            <option th:each="raceOpt : ${T(net.bst.springboot.springsecurity.model.Race).values()}"
                                    th:value="${raceOpt}" th:text="${raceOpt.displayName}">Race Name</option>
                        </select>
                         <p class="help-block" th:if="${#fields.hasErrors('race')}" th:errors="*{race}">Race Error</p>
                    </div>

                    <div class="form-group">
                        <button type="submit" class="btn btn-success">Create Team</button>
                    </div>

                </form>

            </div>
        </div>
    </div>

    <script type="text/javascript" th:src="@{/webjars/jquery/3.2.1/jquery.min.js}"></script>
    <script type="text/javascript" th:src="@{/webjars/bootstrap/3.3.7/js/bootstrap.min.js}"></script>

</body>
</html>
