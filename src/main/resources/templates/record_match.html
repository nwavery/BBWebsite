<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity5">
<head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title th:text="${isEditMode} ? 'Edit Match Result' : 'Record Match Result'">Record Match</title>

    <!-- Updated BS5 CSS -->
    <link rel="stylesheet" type="text/css" th:href="@{/webjars/bootstrap/5.3.2/css/bootstrap.min.css}" />
    <link rel="stylesheet" type="text/css" th:href="@{/css/main.css}" />
    <style>
        .team-section {
            border: 1px solid #dee2e6; /* Updated BS5 border color */
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            border-radius: .375rem; /* Updated BS5 radius */
        }
        .team-section h3 {
            margin-top: 0;
            border-bottom: 1px solid #eee;
            padding-bottom: .75rem;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
    <!-- Updated BS5 Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
        <div class="container">
            <a class="navbar-brand" th:href="@{/}">Blood Bowl Stats</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarColor02" aria-controls="navbarColor02" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarColor02">
                <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                     <li class="nav-item"><a class="nav-link" th:href="@{/}">Home</a></li>
                     <li class="nav-item"><a class="nav-link" th:href="@{/teams}">Your Teams</a></li>
                     <li class="nav-item active"><a class="nav-link" th:href="@{/matches/new}">Record Match</a> <span class="visually-hidden">(current)</span></li>
                     <li class="nav-item"><a class="nav-link" th:href="@{/matches/history}">Match History</a></li>
                     <li class="nav-item"><a class="nav-link" th:href="@{/matches/standings}">Standings</a></li>
                     <li class="nav-item" sec:authorize="isAuthenticated()"><a class="nav-link" th:href="@{/logout}">Logout</a></li>
                 </ul>
            </div>
        </div>
    </nav>

    <div class="container" style="padding-top: 70px;">
        <h1 th:text="${isEditMode} ? 'Edit Match Result' : 'Record Match Result'">Record Match</h1>

        <!-- Updated BS5 Alerts -->
        <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <span th:text="${errorMessage}">Error placeholder</span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <form th:action="${isEditMode} ? @{/matches/{id}(id=${matchId})} : @{/matches}" th:object="${matchDto}" method="post">
            <!-- Validation errors -->
             <div th:if="${#fields.hasErrors('*')}" class="alert alert-danger">
                 Please correct the errors below.
             </div>

            <div class="row">
                <!-- Team A Section -->
                <div class="col-md-6">
                    <div class="team-section">
                        <h3>Team A</h3>
                        <div class="mb-3">
                            <label for="teamAId" class="form-label">Select Team A</label>
                            <select class="form-select" id="teamAId" th:field="*{teamAId}" th:errorclass="is-invalid">
                                <option value="">-- Select Team --</option>
                                <option th:each="team : ${allTeams}" th:value="${team.id}" th:text="${team.name}">Team Name</option>
                            </select>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('teamAId')}" th:errors="*{teamAId}"></div>
                        </div>

                        <div class="mb-3">
                            <label for="scoreTeamA" class="form-label">Score Team A</label>
                            <input type="number" class="form-control" id="scoreTeamA" th:field="*{scoreTeamA}" min="0" required th:errorclass="is-invalid" />
                             <div class="invalid-feedback" th:if="${#fields.hasErrors('scoreTeamA')}" th:errors="*{scoreTeamA}"></div>
                        </div>

                        <div class="mb-3">
                            <label for="touchdownsTeamA" class="form-label">Touchdowns Team A</label>
                            <input type="number" class="form-control" id="touchdownsTeamA" th:field="*{touchdownsTeamA}" min="0" required th:errorclass="is-invalid" />
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('touchdownsTeamA')}" th:errors="*{touchdownsTeamA}"></div>
                        </div>

                        <div class="mb-3">
                            <label for="casualtiesTeamA" class="form-label">Casualties Inflicted by Team A</label>
                            <input type="number" class="form-control" id="casualtiesTeamA" th:field="*{casualtiesTeamA}" min="0" required th:errorclass="is-invalid" />
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('casualtiesTeamA')}" th:errors="*{casualtiesTeamA}"></div>
                        </div>
                    </div>
                </div>

                <!-- Team B Section -->
                <div class="col-md-6">
                     <div class="team-section">
                        <h3>Team B</h3>
                        <div class="mb-3">
                            <label for="teamBId" class="form-label">Select Team B</label>
                            <select class="form-select" id="teamBId" th:field="*{teamBId}" th:errorclass="is-invalid">
                                <option value="">-- Select Team --</option>
                                <option th:each="team : ${allTeams}" th:value="${team.id}" th:text="${team.name}">Team Name</option>
                            </select>
                             <div class="invalid-feedback" th:if="${#fields.hasErrors('teamBId')}" th:errors="*{teamBId}"></div>
                        </div>

                        <div class="mb-3">
                            <label for="scoreTeamB" class="form-label">Score Team B</label>
                            <input type="number" class="form-control" id="scoreTeamB" th:field="*{scoreTeamB}" min="0" required th:errorclass="is-invalid" />
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('scoreTeamB')}" th:errors="*{scoreTeamB}"></div>
                        </div>

                         <div class="mb-3">
                            <label for="touchdownsTeamB" class="form-label">Touchdowns Team B</label>
                            <input type="number" class="form-control" id="touchdownsTeamB" th:field="*{touchdownsTeamB}" min="0" required th:errorclass="is-invalid" />
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('touchdownsTeamB')}" th:errors="*{touchdownsTeamB}"></div>
                        </div>

                        <div class="mb-3">
                            <label for="casualtiesTeamB" class="form-label">Casualties Inflicted by Team B</label>
                            <input type="number" class="form-control" id="casualtiesTeamB" th:field="*{casualtiesTeamB}" min="0" required th:errorclass="is-invalid" />
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('casualtiesTeamB')}" th:errors="*{casualtiesTeamB}"></div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="mt-3">
                 <button type="submit" class="btn btn-primary" th:text="${isEditMode} ? 'Update Match' : 'Record Match'">Record Match</button>
                 <a th:href="@{/matches/history}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>

    <!-- Updated Bootstrap 5 JS Bundle -->
    <script type="text/javascript" th:src="@{/webjars/bootstrap/5.3.2/js/bootstrap.bundle.min.js}"></script>
    <script type="text/javascript" th:src="@{/webjars/jquery/3.6.4/jquery.min.js}"></script>
</body>
</html>
