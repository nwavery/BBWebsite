<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity3">
<head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Edit Player</title>

    <link rel="stylesheet" type="text/css" th:href="@{/webjars/bootstrap/3.3.7/css/bootstrap.min.css}" />
    <link rel="stylesheet" type="text/css" th:href="@{/css/main.css}" />
</head>
<body>
    <nav class="navbar navbar-inverse navbar-fixed-top">
        <!-- Navbar content -->
        <div class="container">
             <div class="navbar-header">
                 <button type="button" class="navbar-toggle collapsed"
                         data-toggle="collapse" data-target="#navbar" aria-expanded="false"
                         aria-controls="navbar">
                     <span class="sr-only">Toggle navigation</span>
                     <span class="icon-bar"></span> <span class="icon-bar"></span> <span class="icon-bar"></span>
                 </button>
                 <a class="navbar-brand" href="#" th:href="@{\/">Blood Bowl Stats</a>
             </div>
             <div id="navbar" class="collapse navbar-collapse">
                 <ul class="nav navbar-nav">
                     <li><a th:href="@{/}">Home</a></li>
                     <li><a th:href="@{/teams}">Your Teams</a></li>
                     <li><a th:href="@{/matches/new}">Record Match</a></li>
                     <li><a th:href="@{/matches/history}">Match History</a></li>
                     <li><a th:href="@{/matches/standings}">Standings</a></li>
                     <li sec:authorize="isAuthenticated()"><a th:href="@{/logout}">Logout</a></li>
                 </ul>
             </div>
         </div>
    </nav>

    <br><br>

    <div class="container">
        <div class="row">
            <div class="col-md-6 col-md-offset-3">

                <h1>Edit Player</h1>

                 <!-- Display general error messages -->
                <div th:if="${playerError}" class="alert alert-danger" role="alert"
                    th:text="${playerError}">
                     Error placeholder
                </div>

                 <!-- Error message if redirected with validation errors -->
                 <div th:if="${param.error}" class="alert alert-danger">
                    There were errors with your submission. Please check the fields below.
                </div>

                <!-- Submit to /players/{playerId} -->
                <form th:action="@{/players/{id}(id=${playerId})}" th:object="${playerDto}" method="post">

                    <!-- Hidden input for teamId needed for DTO binding -->
                    <input type="hidden" th:field="*{teamId}" />

                    <!-- Display validation errors -->
                    <div th:if="${#fields.hasErrors('*')}" class="alert alert-danger">
                        Please correct the errors below.
                    </div>

                    <div class="form-group" th:classappend="${#fields.hasErrors('name')}? 'has-error' : ''">
                        <label for="playerName">Player Name</label>
                        <input type="text" class="form-control" id="playerName" th:field="*{name}" required />
                         <p class="help-block" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">Name Error</p>
                    </div>

                    <div class="form-group" th:classappend="${#fields.hasErrors('position')}? 'has-error' : ''">
                        <label for="playerPosition">Position</label>
                         <select id="playerPosition" class="form-control" th:field="*{position}" required>
                             <option value="">-- Select Position --</option>
                             <option th:each="posOpt : ${T(net.bst.springboot.springsecurity.model.Position).values()}"
                                     th:value="${posOpt}" th:text="${posOpt.displayName}">Position Name</option>
                         </select>
                         <p class="help-block" th:if="${#fields.hasErrors('position')}" th:errors="*{position}">Position Error</p>
                    </div>

                    <div class="form-group">
                        <button type="submit" class="btn btn-primary">Update Player</button>
                        <!-- Cancel link goes back to the specific team details page -->
                        <a th:href="@{/teams/{id}(id=${teamId})}" class="btn btn-default">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script type="text/javascript" th:src="@{/webjars/jquery/3.2.1/jquery.min.js}"></script>
    <script type="text/javascript" th:src="@{/webjars/bootstrap/3.3.7/js/bootstrap.min.js}"></script>
</body>
</html>
